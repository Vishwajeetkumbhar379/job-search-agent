[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-agent"
version = "0.1.0"
description = "Live ATS job discovery, evidence-based fit scoring and an AI-writing linter for applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishwajeet Kumbhar" }]
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
jobscout = "job_search_agent.cli:main"

[tool.setuptools]
packages = ["job_search_agent"]
